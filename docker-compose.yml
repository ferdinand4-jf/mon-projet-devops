version: '3.8'

services:
  # Service 1 : La Base de Données PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: devops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Service 2 : Le Backend Express
  backend:
    build: ./backend
    container_name: devops_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres_db:5432/devops_db
    depends_on:
      - postgres_db

  # Service 3 : Le Frontend Next.js
  frontend:
    build: ./frontend
    container_name: devops_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: